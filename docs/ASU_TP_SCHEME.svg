<text x="50" y="1068" font-size="18" fill="#20384C" text-anchor="start">КИС — корпоративная информационная система; САУ — система автоматического управления.</text>
<text x="50" y="1098" font-size="18" fill="#20384C" text-anchor="start">ИМ — исполнительные механизмы; Д — датчики уровня и расхода; О₁…Оₙ — нефтебазы и АЗС.</text>
<text x="50" y="1130" font-size="18" fill="#20384C" text-anchor="start">Вниз — задания и управляющие воздействия; вверх — измерения и состояния объектов.</text>
