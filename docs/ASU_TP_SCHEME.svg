<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1180" viewBox="0 0 1400 1180" role="img" aria-labelledby="title description">
<title id="title">Упрощённая структурная схема АСУ ТП с модулем оптимизации поставок</title>
<desc id="description">Схема по предоставленному образцу: КИС и модуль оптимизации, уровень диспетчеризации, уровень САУ, три типовых контура исполнительный механизм — объект — датчик. Вниз передаются план, подтверждённые задания и управляющие воздействия; вверх — измерения и состояния. Объекты О1, О2 и Он обозначают нефтебазы и АЗС. Аппаратная интеграция является предлагаемой.</desc>
